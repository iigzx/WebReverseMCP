name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install CI repo init script (official repos first)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp .github/ci/ci-repos.gradle "$HOME/.gradle/init.d/ci-repos.gradle"
      - name: Static audit (Kotlin JSON qualified names)
        continue-on-error: true
        run: python3 .github/ci/audit_kotlin_json.py .
      - name: Static audit (missing required args)
        continue-on-error: true
        run: python3 .github/ci/audit_required_args.py .
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Run JVM unit tests
        run: chmod +x gradlew && ./gradlew test --no-daemon --continue --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 需要 contents:write 才能把 APK 发到 rolling release（artifact 下载要登录，release 是匿名直链）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install CI repo init script (official repos first)
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cp .github/ci/ci-repos.gradle "$HOME/.gradle/init.d/ci-repos.gradle"
      - name: Ensure required SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
      - name: Assemble debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          find . -name '*.apk' -path '*/outputs/apk/*' -exec cp -v {} dist/ \;
          cd dist && for f in *.apk; do mv -f "$f" WebReverseMCP-debug.apk; done
          ls -la
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WebReverseMCP-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
      # 额外发一个「固定链接」的 release：artifact 必须登录 GitHub 才能下载，
      # 而 release 资产是匿名直链，手机浏览器点开即可安装（用户实际使用的取包方式）。
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest --prerelease \
              --title "WebReverseMCP 改版 · 最新构建（自动更新）" \
              --notes "每次 main 构建自动覆盖本 release 的 APK。固定直链见下方资产名。"
          gh release upload debug-latest dist/WebReverseMCP-debug.apk --clobber
