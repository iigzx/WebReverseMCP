name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit tests (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
      - name: Run JVM unit tests
        run: chmod +x gradlew && ./gradlew test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore
          retention-days: 7

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Ensure required SDK packages
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
      - name: Assemble debug APK
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APK
        run: |
          mkdir -p dist
          find . -name '*.apk' -path '*/outputs/apk/*' -exec cp -v {} dist/ \;
          ls -la dist
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebReverseMCP-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
